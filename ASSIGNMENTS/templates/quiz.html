<!--
AI Usage:
Used ChatGPT to help structure Jinja loops and fix issues with loop indexing
(previously used loop.parent which caused errors).
-->

<!DOCTYPE html>
<html>
<head>
    <title>Quiz</title>
</head>
<body>
<div style="text-align:right;">
    <a href="/logout">Logout</a>
</div>

<h1>🎵 2016 Top Pop Songs Quiz 🎵</h1>
<h2>Welcome, {{ user }}</h2>

<form method="POST" action="/submit">

{% for q in questions %}
  <div>
    <p><strong>{{ q.question }}</strong></p>

    {% set q_index = loop.index0 %}

    {% for option in q.options %}
      <input type="radio" name="q{{ q_index }}" value="{{ option.split('.')[0] }}" required>
      {{ option }}<br>
    {% endfor %}
  </div>
  <hr>
{% endfor %}

    <button type="submit">Submit Answers</button>
</form>

</body>
</html>
